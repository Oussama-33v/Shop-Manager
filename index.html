<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shope manager</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
        dialog::backdrop {
            backdrop-filter: blur(15px);

<body class="flex flex-col p-4 bg-[#EAE7DF] gap-7">
    <header class="flex items-center justify-between p-3 rounded-2xl">
        <h1 class="font-bold text-3xl antialiased not-italic">Shope Manager</h1>
        <div class="flex items-center gap-10">
            <button id="my-cart" class="flex flex-col items-center" onclick="showCartClick()">
                <ion-icon name="cart-outline" style="height: 30px; width: 30px"
                    class="flex p-2 bg-white rounded-2xl"></ion-icon>
                <span class="font-bold">My cart</span>
            </button>
            <span class="p-2 bg-white flex items-center rounded-2xl gap-3 font-bold">Login / Signe up<ion-icon
                    name="person-sharp" style="height: 30px; width: 30px"
                    class="p-2 bg-blue-100 rounded-full"></ion-icon></span>
        </div>
    </header>
    <main class="flex flex-col bg-[#EFF0F4] p-4 rounded-2xl gap-4">
        <section id="slaycers" class="w-full flex items-center justify-between gap-10">
            <div class="maxPrice flex flex-col gap-3">
                <input type="number" min="0" id="maxPrice" name="maxPrice" placeholder="any price"
                    class="w-full size-1/3 border border-[#444851] rounded-xl px-3 py-2.5 text-black outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
            </div>
            <div class="flex items-center gap-2 size-1/3">
                <ion-icon name="search-sharp" style="height: 40px; width: 40px"></ion-icon>
                <input id="search-for-product" type="text" placeholder="search for a product"
                    class="w-full size-1/3 border border-[#444851] rounded-xl px-3 py-2.5 text-black outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
            </div>
            <select
                class="size-1/3 border border-[#444851] rounded-xl px-3 py-2.5 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors"
                name="slyce by category" id="category">
                <option value="Default" selected disabled>Select a category</option>
                <!-- <option value="">Electronic</option>
                <option value="">Home</option> -->
            </select>
        </section>
        <hr class="color-black-900" />
        <ul id="products" class="bg-blue-0 grid grid-cols-4 grid-rows gap-4">

        </ul>
        <dialog id="my-cart-dialog"
            class="w-[90%] bg-[#292c32] border border-[#383b43] rounded-2xl shadow-xl p-0 backdrop:bg-black/60">
            <section id="selected-products" class="w-full flex flex-col gap-4 bg-[#EAE7DF] p-6 rounded-3xl">
                <div class="flex items-center justify-between">
                    <h2 class="font-bold text-3xl text-[#2475AF]">My cart</h2>
                    <button id="close-dialog" onclick="closeCartClick() "
                        class="p-3 rounded-xl bg-[#2475AF] items-center flex text-[#EAE7DF]">
                        <ion-icon name="close-circle-outline" style="height: 30px; width: 30px"></ion-icon>
                    </button>
                </div>

                <div class="flex gap-5">
                    <ul id="product-card" class="w-[60%] flex flex-col gap-3 ">
                        <!-- <li
                            class="flex h-80 gap-12 text-[#2475AF] bg-gradient-to-r from-[#EAE7DF] to-[#C6DCF2] rounded-2xl">

                                        movement
                                        of the light.

                                <div class="flex flex-col gap-3">

                                        <button class="p-3 bg-white rounded-full"><ion-icon name="add-outline"
                                                style="width: px; height: 15px"></ion-icon></button>
                                    </div>
                                </div>
                            </article>
                        </li> -->
                    </ul>
                    <div class="w-[40%] bg-white p-4 rounded-2xl flex flex-col gap-10">
                        <div>
                            <h2 class="text-4xl text-[#2475AF] font-bold">Chope Manager</h2>
                            <p>Complet your reservation !</p>
                        </div>
                        <form id="reservation-infos" class="flex flex-col gap-4 ">
                            <div class="flex flex-col gap-2">
                                <label for="name" class="text-sm font-medium text-black">
                                    Full name
                                </label>
                                <input id="full-name" type="text" required placeholder="Enter full name" name="client"
                                    class="w-full border border-[#444851] rounded-xl px-3 py-2.5 placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="email" class="text-sm font-medium text-black">
                                    Email
                                </label>
                                <input id="email" type="text" required placeholder="Enter your email" name="email"
                                    class="w-full border border-[#444851] rounded-xl px-3 py-2.5 placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="phone number" class="text-sm font-medium text-black">
                                    Phone
                                </label>
                                <input id="phone-number" type="number" required placeholder="Enter your Phone number"
                                    name="phone"
                                    class="w-full border border-[#444851] rounded-xl px-3 py-2.5  placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="location" class="text-sm font-medium text-black">
                                    Address
                                </label>
                                <input id="client-location" type="text" required placeholder="Enter your address"
                                    name="phone"
                                    class="w-full border border-[#444851] rounded-xl px-3 py-2.5 placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="city" class="text-sm font-medium text-black">
                                    city
                                </label>
                                <input id="client-city" type="text" required placeholder="What city you from"
                                    name="city"
                                    class="w-full border border-[#444851] rounded-xl px-3 py-2.5 placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
                            </div>
                            <div class="flex flex-col gap-2">
                                <label for="code postal" class="text-sm font-medium text-black">
                                    Code postal
                                </label>
                                <input id="code-postal" type="text" required placeholder="Ex :83300" name="codePostal"
                                    class="w-full border border-[#444851] rounded-xl px-3 py-2.5 placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors" />
                            </div>
                        </form>
                        <button
                            class="w-full bg-[#2475AF] text-white border border-[#444851] rounded-xl px-3 py-2.5 placeholder-gray-500 outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition-colors">Valide</button>
                    </div>
                </div>
            </section>
        </dialog>
    </main>
    <script src="js/data-fetched.js"></script>
    <script src="js/main.js"></script>
    <script>
        const myCartDialog = document.getElementById("my-cart-dialog");
        function showCartClick() {
            myCartDialog.showModal();
        }
        function closeCartClick() {
            myCartDialog.close();
        }
    </script>
    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>

</html>
